# Broker, simulated fleet, telemetry storage, event log, ingest, API and dashboard.
#
# By default the API and dashboard are left out, so either can run on the host with a
# debugger attached while everything they depend on runs in containers:
#
#   docker compose up -d                  broker, fleet, database, log, ingest
#   docker compose --profile full up -d   the above plus the API and dashboard

name: iot-fleet

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: fleet-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # mosquitto_sub with -E exits as soon as the subscription is acknowledged, which
      # proves the broker is actually accepting sessions rather than merely listening.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-E", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  fleet-sim:
    build:
      context: ..
      dockerfile: devices/sim-go/Dockerfile
    image: iot-fleet/sim-go:dev
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      # Overridable from the shell: SIM_DEVICES=1000 docker compose up -d
      SIM_PROFILE: "${SIM_PROFILE:-dev}"
      SIM_BROKER: tcp://mosquitto:1883
      SIM_DEVICES: "${SIM_DEVICES:-100}"
      SIM_SITES: "${SIM_SITES:-4}"
      SIM_RATE: "${SIM_RATE:-1s}"
      SIM_SEED: "${SIM_SEED:-1}"
      # Percentage of devices that drop their TCP connection ungracefully each interval,
      # so the broker publishes their Last Will. This is how presence detection is exercised.
      SIM_FLAP_PCT: "${SIM_FLAP_PCT:-2}"
      SIM_FLAP_INTERVAL: "${SIM_FLAP_INTERVAL:-20s}"
    ulimits:
      # One TCP connection per device. The default file-descriptor limit does not cover
      # the thousand-device profile, and the failure mode is an opaque connection error.
      nofile:
        soft: 65536
        hard: 65536

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: fleet-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      # Local development only. Real credentials arrive with the security work.
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./timescale:/docker-entrypoint-initdb.d:ro
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nats:
    image: nats:2.10-alpine
    container_name: fleet-nats
    restart: unless-stopped
    # JetStream is what makes the log durable and replayable; without -js this is a
    # fire-and-forget bus and the projection could not recover from a checkpoint.
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8222/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  fleet-ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    image: iot-fleet/ingest:dev
    container_name: fleet-ingest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      INGEST_BROKER: tcp://mosquitto:1883
      INGEST_DATABASE_URL: postgres://fleet:fleet@timescaledb:5432/fleet
      INGEST_NATS_URL: nats://nats:4222
      INGEST_HTTP_ADDR: ":9101"
      # Sites this instance owns. Empty means the whole fleet; partitioning across
      # instances becomes necessary at stress scale because MQTT 3.1.1 has no shared
      # subscriptions.
      INGEST_SITES: ""
    ports:
      - "9101:9101"

  fleet-api:
    # Only started with --profile full. Left out by default so the inner loop can run the
    # API on the host against containerized infrastructure.
    profiles: ["full"]
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    image: iot-fleet/api:dev
    container_name: fleet-api
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      Log__Url: nats://nats:4222
      Log__Stream: FLEET
      Log__Consumer: fleet-api
      Database__Url: "Host=timescaledb;Port=5432;Database=fleet;Username=fleet;Password=fleet"
    ports:
      - "8080:8080"
    healthcheck:
      # readyz, not healthz: a replaying instance is alive but must not serve a partial fleet.
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  fleet-dashboard:
    # Only started with --profile full, for the same reason as the API: the inner loop runs
    # it on the host.
    profiles: ["full"]
    build:
      context: ..
      dockerfile: clients/dotnet/blazor/Dockerfile
    image: iot-fleet/dashboard:dev
    container_name: fleet-dashboard
    restart: unless-stopped
    depends_on:
      fleet-api:
        condition: service_healthy
    environment:
      # Reached from the browser over the container network name would fail: the WebSocket
      # is opened by the dashboard server, not the browser, so this is a container-to-
      # container address.
      Api__BaseUrl: http://fleet-api:8080
      Api__MaxRateHz: "4"
      # Survives rebuilds. A regenerated key ring invalidates any antiforgery cookie a
      # browser still holds, which silently prevents the Blazor circuit from starting.
      DataProtection__KeyRingPath: /keys
    volumes:
      - dashboard-keys:/keys
    ports:
      - "8090:8090"

volumes:
  dashboard-keys:
  mosquitto-data:
  timescale-data:
  nats-data:
