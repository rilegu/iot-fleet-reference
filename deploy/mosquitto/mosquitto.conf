# Exploratory configuration.
#
# Plaintext and anonymous on purpose: this file exists to validate the message contract,
# not the security model. TLS, per-device credentials and topic ACLs are not implemented
# yet, and this file is replaced when they are. Do not copy it into anything real.

listener 1883
protocol mqtt
allow_anonymous true

# The simulator opens one connection per device. The default limit is well below the
# thousand devices this targets, so raise it here rather than rediscovering it later.
max_connections 15000

# Retained status messages must survive a broker restart, otherwise a consumer that
# reconnects sees an empty fleet until every device happens to send again.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type warning
log_type error
log_type notice
connection_messages false
